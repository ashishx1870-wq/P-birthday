<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Mayna 💗</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  overflow:hidden;
  font-family:Georgia,serif;
  background:
    radial-gradient(circle at 20% 20%,#ffd9e8 0,transparent 35%),
    radial-gradient(circle at 80% 80%,#ddd4ff 0,transparent 35%),
    linear-gradient(135deg,#fff1f7,#eeeaff);
  color:#4a3b43;
}

/* ---------- OPENING ---------- */

.opening{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}

.open-content{
  animation:fadeIn 1.5s ease;
}

.small{
  font-family:Arial,sans-serif;
  letter-spacing:3px;
  font-size:12px;
  color:#9b7285;
  text-transform:uppercase;
  margin-bottom:15px;
}

.open-content h1{
  font-size:32px;
  color:#c84d7c;
  margin-bottom:35px;
}

/* ---------- GIFT ---------- */

.gift{
  width:180px;
  height:150px;
  position:relative;
  margin:auto;
  cursor:pointer;
  filter:drop-shadow(0 18px 20px rgba(130,70,100,.18));
}

.box{
  position:absolute;
  bottom:0;
  width:180px;
  height:105px;
  border-radius:8px;
  background:linear-gradient(135deg,#ef6295,#d94379);
}

.box:before{
  content:"";
  position:absolute;
  left:75px;
  width:30px;
  height:105px;
  background:#f8d47b;
}

.lid{
  position:absolute;
  z-index:3;
  top:27px;
  left:-10px;
  width:200px;
  height:35px;
  border-radius:8px;
  background:#df477e;
  transition:1s cubic-bezier(.68,-.55,.27,1.55);
}

.lid:before{
  content:"";
  position:absolute;
  left:85px;
  width:30px;
  height:35px;
  background:#f8d47b;
}

.ribbon-left,
.ribbon-right{
  position:absolute;
  z-index:4;
  width:55px;
  height:30px;
  border:7px solid #f8d47b;
  top:0;
}

.ribbon-left{
  left:45px;
  border-radius:50% 50% 10% 50%;
  transform:rotate(-25deg);
}

.ribbon-right{
  right:45px;
  border-radius:50% 50% 50% 10%;
  transform:rotate(25deg);
}

.tap{
  margin-top:28px;
  font-family:Arial,sans-serif;
  color:#806773;
  font-size:14px;
  animation:pulse 1.8s infinite;
}

/* ---------- SURPRISE ---------- */

.surprise{
  display:none;
  min-height:100vh;
  overflow-y:auto;
  padding:45px 20px;
  text-align:center;
  animation:reveal 1.2s ease;
}

.inner{
  max-width:520px;
  margin:auto;
}

.top{
  font-family:Arial,sans-serif;
  font-size:12px;
  letter-spacing:3px;
  color:#a06c82;
  text-transform:uppercase;
}

.title{
  font-size:38px;
  color:#c74375;
  margin:15px 0 25px;
}

/* ---------- PHOTO ---------- */

.photo-frame{
  width:230px;
  margin:0 auto 28px;
  padding:10px 10px 25px;
  background:#fff;
  box-shadow:0 15px 35px rgba(80,40,70,.18);
  transform:rotate(-3deg);
  animation:photoIn 1.2s ease;
}

.photo{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
  background:#f7dce8;
}

.photo-caption{
  font-family:cursive;
  color:#9b667d;
  margin-top:10px;
}

/* ---------- LETTER ---------- */

.letter{
  background:rgba(255,255,255,.78);
  border-radius:24px;
  padding:30px 24px;
  box-shadow:0 15px 45px rgba(70,40,70,.12);
  line-height:1.8;
  font-size:16px;
  text-align:left;
}

.letter-title{
  text-align:center;
  color:#c74375;
  font-size:24px;
  margin-bottom:18px;
}

.friendship{
  margin-top:22px;
  padding:18px;
  border-radius:16px;
  background:linear-gradient(135deg,#fff0f6,#f0ebff);
  text-align:center;
  color:#9a4d72;
  font-style:italic;
}

.signature{
  text-align:right;
  margin-top:20px;
  color:#9b687d;
}

/* ---------- FINAL ---------- */

.final{
  margin-top:30px;
  padding:28px 20px;
}

.final h2{
  color:#c74375;
  font-size:25px;
  margin-bottom:12px;
}

.final p{
  color:#806773;
  line-height:1.7;
}

/* ---------- PARTICLES ---------- */

.particle{
  position:fixed;
  top:-30px;
  pointer-events:none;
  animation:fall linear forwards;
  z-index:20;
}

/* ---------- ANIMATIONS ---------- */

@keyframes fadeIn{
  from{opacity:0;transform:translateY(25px)}
  to{opacity:1;transform:translateY(0)}
}

@keyframes reveal{
  from{opacity:0;transform:scale(.92)}
  to{opacity:1;transform:scale(1)}
}

@keyframes photoIn{
  from{opacity:0;transform:translateY(40px) rotate(-10deg)}
  to{opacity:1;transform:translateY(0) rotate(-3deg)}
}

@keyframes pulse{
  50%{opacity:.45}
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(540deg);
    opacity:0;
  }
}

@media(max-width:450px){
  .open-content h1{
    font-size:28px;
  }

  .title{
    font-size:32px;
  }
}
</style>
</head>

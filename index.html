<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Pallavi 💗</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #ffd6e7, #e8d9ff);
  font-family: Arial, sans-serif;
  overflow: hidden;
}

.container {
  text-align: center;
}

h1 {
  color: #ff4f91;
  font-size: 28px;
  margin-bottom: 25px;
}

.gift {
  width: 180px;
  height: 150px;
  position: relative;
  margin: auto;
  cursor: pointer;
  transition: transform 0.3s;
}

.gift:hover {
  transform: scale(1.05);
}

.box {
  position: absolute;
  bottom: 0;
  width: 180px;
  height: 110px;
  background: #ff5c93;
  border-radius: 8px;
}

.box::before {
  content: "";
  position: absolute;
  left: 75px;
  width: 30px;
  height: 110px;
  background: #ffd166;
}

.lid {
  position: absolute;
  top: 30px;
  left: -10px;
  width: 200px;
  height: 35px;
  background: #ff4081;
  border-radius: 8px;
  transition: 0.8s ease;
  z-index: 2;
}

.lid::before {
  content: "";
  position: absolute;
  left: 85px;
  width: 30px;
  height: 35px;
  background: #ffd166;
}

.tap {
  margin-top: 25px;
  color: #555;
  font-size: 16px;
}

/* Birthday card */

.card {
  display: none;
  width: 90%;
  max-width: 360px;
  padding: 25px;
  background: rgba(255,255,255,0.9);
  border-radius: 25px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.15);
  animation: appear 1s ease forwards;
}

.photo {
  width: 190px;
  height: 190px;
  object-fit: cover;
  border-radius: 50%;
  border: 6px solid #ff76a8;
  box-shadow: 0 8px 25px rgba(255,80,140,0.35);
}

.card h2 {
  color: #ff4081;
  margin: 18px 0 10px;
}

.card p {
  color: #555;
  line-height: 1.6;
  font-size: 16px;
}

.heart {
  font-size: 30px;
  animation: beat 1s infinite;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: scale(0.5) translateY(50px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

@keyframes beat {
  50% {
    transform: scale(1.3);
  }
}

.confetti {
  position: fixed;
  top: -20px;
  font-size: 22px;
  animation: fall 3s linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(360deg);
  }
}
</style>
</head>

<body>

<div class="container" id="opening">

  <h1>Something special for you 💗</h1>

  <div class="gift" onclick="openGift()">
    <div class="lid" id="lid"></div>
    <div class="box"></div>
  </div>

  <div class="tap">🎁 Tap the gift to open 🎁</div>

</div>


<div class="card" id="card">

  <!-- YAHAN PHOTO LAGANI HAI -->
  <img class="photo"
       src="https://placehold.co/400x400/ffd6e7/ff4081?text=Mayna+%F0%9F%92%97"
       alt="Mayna">

  <div class="heart">💗</div>

  <h2>Happy Birthday, Pallavi ! 🎂</h2>

  <p>
    Wishing you a day filled with happiness,
    beautiful moments and lots of smiles. ✨
  </p>

  <p>
    May your special day be as wonderful as you are. 🌸
  </p>

  <div>🎂 🎈 💐 ✨ 💗</div>

</div>


<script>

function openGift() {

  const lid = document.getElementById("lid");
  const opening = document.getElementById("opening");
  const card = document.getElementById("card");

  lid.style.transform = "translateY(-100px) rotate(-10deg)";

  setTimeout(() => {

    opening.style.display = "none";
    card.style.display = "block";

    // Confetti
    for (let i = 0; i < 35; i++) {

      const confetti = document.createElement("div");

      confetti.className = "confetti";

      const emojis = ["💗","✨","🎉","💕","🌸","🎀"];

      confetti.innerText =
        emojis[Math.floor(Math.random() * emojis.length)];

      confetti.style.left =
        Math.random() * 100 + "vw";

      confetti.style.animationDuration =
        (2 + Math.random() * 2) + "s";

      document.body.appendChild(confetti);

      setTimeout(() => {
        confetti.remove();
      }, 4000);
    }

  }, 900);
}

</script>

</body>
</html>
